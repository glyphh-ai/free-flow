<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1621">
<title>Free Flow: downhill skate racing</title>
<meta name="description" content="Bomb a mountain road on a longboard against five other riders. Pick your skater, your deck, your wheels and your vibe.">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<style>
  :root { --ink: #f4f1ea; --dim: #b9c2cc; --hot: #ff5d3a; --sun: #ffd23f; --bg: rgba(14,22,33,0.78); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1621; color: var(--ink); font: 600 15px/1.3 "Avenir Next", "Futura", "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  .hide { display: none !important; }
  h1 { margin: 0; font: 900 italic 54px/0.9 "Futura", "Avenir Next", system-ui, sans-serif; letter-spacing: -1px; text-transform: uppercase; }
  h1 b { color: var(--hot); }
  /* the gear menu: on the left over the rider turning on the start line */
  #menu { position: fixed; left: 0; top: 0; bottom: 0; width: min(420px, 100%); padding: 26px 26px 20px; background: linear-gradient(90deg, rgba(14,22,33,0.94), rgba(14,22,33,0.82) 80%, rgba(14,22,33,0)); overflow-y: auto; }
  #menu .tag { color: var(--dim); margin: 8px 0 18px; font-weight: 500; }
  .row { margin: 14px 0 6px; color: var(--dim); font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; }
  .opts { display: flex; flex-wrap: wrap; gap: 7px; }
  .opt { border: 2px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: var(--ink); padding: 8px 11px; border-radius: 10px; cursor: pointer; font: inherit; font-size: 14px; }
  .opt.on { border-color: var(--hot); background: rgba(255,93,58,0.18); }
  .opt small { display: block; color: var(--dim); font-weight: 500; font-size: 11px; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.2); cursor: pointer; padding: 0; }
  .sw.on { border-color: #fff; transform: scale(1.12); }
  #ride { margin-top: 22px; width: 100%; padding: 16px; font: 900 italic 24px/1 "Futura", system-ui, sans-serif; text-transform: uppercase; color: #111; background: var(--sun); border: 0; border-radius: 14px; cursor: pointer; box-shadow: 0 6px 0 #c79a00; }
  #ride:active { transform: translateY(3px); box-shadow: 0 3px 0 #c79a00; }
  .keys { margin-top: 14px; color: var(--dim); font-size: 12px; font-weight: 500; }
  /* racing */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #place { position: absolute; left: 18px; top: 14px; font: 900 italic 64px/1 "Futura", system-ui, sans-serif; text-shadow: 0 3px 0 rgba(0,0,0,0.35); }
  #place small { font-size: 26px; color: var(--dim); }
  #time { position: absolute; right: 18px; top: 18px; font: 800 26px/1 ui-monospace, Menlo, monospace; text-shadow: 0 2px 0 rgba(0,0,0,0.4); }
  #speed { position: absolute; right: 18px; bottom: 18px; text-align: right; font: 900 italic 58px/0.9 "Futura", system-ui, sans-serif; text-shadow: 0 3px 0 rgba(0,0,0,0.35); }
  #speed small { display: block; font-size: 14px; color: var(--dim); font-style: normal; letter-spacing: 2px; }
  #bar { position: absolute; left: 50%; top: 22px; width: min(46vw, 420px); height: 8px; transform: translateX(-50%); background: rgba(0,0,0,0.35); border-radius: 4px; }
  #bar i { position: absolute; top: -3px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; border: 2px solid #111; }
  #bar i.me { width: 18px; height: 18px; top: -5px; margin-left: -9px; border-color: #fff; z-index: 2; }
  #flag { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); font: 900 italic 130px/1 "Futura", system-ui, sans-serif; color: var(--sun); text-shadow: 0 6px 0 rgba(0,0,0,0.45); }
  #msg { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); font: 900 italic 30px/1 "Futura", system-ui, sans-serif; color: var(--sun); text-shadow: 0 3px 0 rgba(0,0,0,0.4); white-space: nowrap; }
  /* the two halves of the screen: a glow on the side held, hotter once it is a slide */
  #touch { position: fixed; inset: 0; pointer-events: none; }
  #touch i { position: absolute; top: 0; bottom: 0; width: 22%; opacity: 0; transition: opacity 0.12s; }
  #touch i:first-child { left: 0; background: linear-gradient(90deg, rgba(255,255,255,0.22), rgba(255,255,255,0)); }
  #touch i:last-child { right: 0; background: linear-gradient(270deg, rgba(255,255,255,0.22), rgba(255,255,255,0)); }
  #touch.left i:first-child, #touch.right i:last-child { opacity: 1; }
  #touch.slide i:first-child { background: linear-gradient(90deg, rgba(255,93,58,0.5), rgba(255,93,58,0)); }
  #touch.slide i:last-child { background: linear-gradient(270deg, rgba(255,93,58,0.5), rgba(255,93,58,0)); }
  #hint { position: absolute; left: 50%; bottom: 13%; transform: translateX(-50%); width: 92%; max-width: 560px; text-align: center; font: 800 16px/1.35 "Avenir Next", system-ui, sans-serif; text-shadow: 0 2px 4px rgba(0,0,0,0.6); transition: opacity 0.6s; }
  #hint b { color: var(--sun); }
  #tl { left: 18px; } #tr { left: 124px; } #ts { right: 18px; bottom: 120px; } #tt { right: 124px; }
  body.touch #speed { font-size: 44px; }
  #results { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, 92vw); padding: 24px; background: var(--bg); border-radius: 18px; backdrop-filter: blur(8px); }
  #results h2 { margin: 0 0 12px; font: 900 italic 40px/1 "Futura", system-ui, sans-serif; text-transform: uppercase; }
  #results table { width: 100%; border-collapse: collapse; }
  #results td { padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  #results td:last-child { text-align: right; font-family: ui-monospace, Menlo, monospace; }
  #results tr.me td { color: var(--sun); }
  #results .btns { display: flex; gap: 10px; margin-top: 18px; }
  #results button { flex: 1; padding: 13px; border-radius: 12px; border: 0; font: 900 italic 18px/1 "Futura", system-ui, sans-serif; text-transform: uppercase; cursor: pointer; }
  #again { background: var(--sun); color: #111; } #gear { background: rgba(255,255,255,0.14); color: var(--ink); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0e1621; z-index: 9; }
  @media (max-width: 640px) {
    h1 { font-size: 40px; }
    #menu { width: 100%; top: auto; max-height: 62%; padding: 16px 16px 14px; background: linear-gradient(0deg, rgba(14,22,33,0.96), rgba(14,22,33,0.9) 85%, rgba(14,22,33,0)); }
    #menu .tag { margin: 4px 0 6px; }
    #place { font-size: 46px; } #flag { font-size: 90px; }
  }
</style>
</head>
<body>
<div id="loading"><h1>Free <b>Flow</b></h1></div>

<div id="menu" class="hide">
  <h1>Free <b>Flow</b></h1>
  <div class="tag">Bomb the hill. Beat five riders to the bottom.</div>
  <div class="row">Skater</div><div class="opts" id="o-who"></div>
  <div class="row">Fit</div><div class="opts" id="o-fit"></div>
  <div class="row">Deck</div><div class="opts" id="o-deck"></div>
  <div class="opts" id="o-deckc" style="margin-top:8px"></div>
  <div class="row">Wheels</div><div class="opts" id="o-wheels"></div>
  <div class="opts" id="o-wheelc" style="margin-top:8px"></div>
  <div class="row">Vibe</div><div class="opts" id="o-vibe"></div>
  <button id="ride">Drop in</button>
  <div class="keys">Hold left or right (screen or ← →) to carve · keep holding to slide · let go to tuck</div>
</div>

<div id="hud" class="hide">
  <div id="place"></div><div id="time"></div><div id="bar"></div>
  <div id="speed"></div><div id="flag"></div><div id="msg"></div>
  <div id="hint">Hold <b>left</b> or <b>right</b> to carve · keep holding to <b>slide</b> · let go to tuck</div>
</div>
<div id="touch"><i></i><i></i></div>

<div id="results" class="hide">
  <h2 id="rtitle"></h2>
  <table id="rtable"></table>
  <div class="btns"><button id="gear">Change gear</button><button id="again">Ride again</button></div>
</div>

<script type="module" src="./game.js"></script>
</body>
</html>
